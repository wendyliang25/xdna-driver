%YAML 1.2
---
$id: http://devicetree.org/schemas/accel/amd,amdxdna.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD XDNA Platform (Shared-Memory + IPI) Transport

maintainers:
  - XRT Team <runtimeca39d@amd.com>

description: |
  The amdxdna platform driver provides a transport layer for the AMD XDNA
  accelerator on ARM SoC platforms (e.g. ZynqMP / Versal) where the NPU is not
  a PCI device.

  Communication with the remote firmware uses:
    - Two shared memory regions from reserved-memory:
        "mgmt"     - management mailbox for command/response messages
        "doorbell" - doorbell region for hardware context notifications
    - ZynqMP IPI mailbox channels (TX + RX) via the Linux mailbox framework
      for interrupt notification only.  The IPI itself carries no data
      (bufferless IPI); the actual message payload is written to/read from
      the shared memory regions.

  The ZynqMP IPI mailbox controller (drivers/mailbox/zynqmp-ipi-mailbox.c)
  handles the underlying IPI hardware.  This device node is a mailbox client
  that references the IPI controller's TX and RX channels.

properties:
  compatible:
    const: amd,amdxdna

  mboxes:
    minItems: 2
    maxItems: 2
    description: |
      Phandle + channel specifier to the ZynqMP IPI mailbox controller.
      Two channels are required:
        - TX channel (index 0) for sending IPI notifications to firmware
        - RX channel (index 1) for receiving IPI notifications from firmware

  mbox-names:
    items:
      - const: tx
      - const: rx

  memory-region:
    minItems: 2
    maxItems: 11
    description: |
      Phandles to reserved-memory regions, matched by name via
      memory-region-names.  "mgmt"/"doorbell" are predefined-layout regions
      accessed only by the CPU (ioremap).  "fw" and "aie<N>" are reusable
      shared-dma-pool regions the driver allocates cacheable, software-coherent
      DMA buffers from with dma_alloc (see memory-region-names).

  memory-region-names:
    minItems: 2
    maxItems: 11
    description: |
      Names of the memory-region phandles.  Required: "mgmt", "doorbell".
      Optional DMA pools: "fw" (firmware-visible; place its reserved-memory
      below 4 GB, as the firmware processor reaches only 32-bit) and "aie<N>"
      (AIE/CERT pools).  All pools are DMA-mapped through this device.  The
      driver maps these to fixed userspace bank ids used in the create-BO
      flags: "fw" -> 0, "aie<N>" -> N + 1.
    items:
      enum: [mgmt, doorbell, fw, aie0, aie1, aie2, aie3, aie4, aie5, aie6]

  iommus:
    maxItems: 1
    description: |
      SMMU stream ID for this device's own DMA -- the AIE/CERT path used by the
      "aie<N>" pools.  Present when the SMMU is enabled.

required:
  - compatible
  - mboxes
  - mbox-names
  - memory-region
  - memory-region-names

additionalProperties: false

examples:
  - |
    /*
     * Example device tree snippet for ZynqMP / Versal platform.
     *
     * The IPI mailbox controller is the existing xlnx,zynqmp-ipi-mailbox
     * (or xlnx,versal-ipi-mailbox) driver.  We use bufferless IPI -
     * no "msg" reg-names are provided in the IPI child node.
     */

    / {
        reserved-memory {
            #address-cells = <2>;
            #size-cells = <2>;
            ranges;

            mgmt_shmem: mgmt-shmem@3e000000 {
                reg = <0x0 0x3e000000 0x0 0x100000>;
                no-map;
            };

            doorbell_shmem: doorbell-shmem@3e100000 {
                reg = <0x0 0x3e100000 0x0 0x10000>;
                no-map;
            };

            /* firmware-visible pool, placed < 4 GB for the 32-bit RPU;
             * cacheable, software-coherent (allocated with dma_alloc). */
            rpu_cma: rpu-cma@70000000 {
                compatible = "shared-dma-pool";
                reg = <0x0 0x70000000 0x0 0x4000000>;
                reusable;
            };

            /* AIE/CERT DMA pool (cacheable, software-coherent) */
            aie_cma0: aie-cma@800000000 {
                compatible = "shared-dma-pool";
                reg = <0x8 0x00000000 0x0 0x40000000>;
                reusable;
            };
        };
    };

    /* IPI mailbox controller (already present in platform DTS) */
    ipi_mailbox: mailbox@ff340000 {
        compatible = "xlnx,versal-ipi-mailbox";
        #address-cells = <2>;
        #size-cells = <2>;
        xlnx,ipi-id = <4>;
        ranges;
        interrupts = <0 72 4>;

        ipi_aie: mailbox@ff370000 {
            compatible = "xlnx,versal-ipi-dest-mailbox";
            xlnx,ipi-id = <1>;
            #mbox-cells = <1>;
            /* No reg / reg-names - bufferless IPI */
        };
    };

    /* SMMU (present when the IOMMU is enabled); provides the AIE stream ID. */
    smmu: iommu {
        #iommu-cells = <1>;
    };

    /* amdxdna platform (shared-memory + IPI) transport node */
    amdxdna: amdxdna {
        compatible = "amd,amdxdna";
        mboxes = <&ipi_aie 0>, <&ipi_aie 1>;
        mbox-names = "tx", "rx";
        /* amdxdna's own DMA (AIE/CERT path) stream ID for the "aie<N>" pools */
        iommus = <&smmu 0x2>;
        memory-region = <&mgmt_shmem>, <&doorbell_shmem>, <&rpu_cma>, <&aie_cma0>;
        memory-region-names = "mgmt", "doorbell", "fw", "aie0";
    };
