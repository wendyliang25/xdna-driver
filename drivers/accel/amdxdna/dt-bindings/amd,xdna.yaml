%YAML 1.2
---
$id: http://devicetree.org/schemas/accel/amd,xdna.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD XDNA Platform (Shared-Memory + IPI) Transport

maintainers:
  - XRT Team <runtimeca39d@amd.com>

description: |
  AMD XDNA on ARM SoC platforms (for example ZynqMP / Versal) uses a
  shared-memory and interrupt-notification transport interface when not exposed
  as a PCI function.

  Communication with remote firmware uses:
    - Four shared-memory regions from reserved-memory:
        "mgmt"     - management command/response ring buffers
        "doorbell" - hardware-context notification ring
        "fw"       - firmware-visible DMA buffer pool (placed below 4 GB for
                     32-bit firmware reachability)
        "aie"      - AIE/CERT DMA buffer pool for device-side buffers
    - ZynqMP/Versal IPI mailbox channels (TX + RX) for interrupt notification
      only. The IPI carries no data (bufferless IPI); mgmt and doorbell share
      this mailbox channel pair for notification only, while data is exchanged
      through shared memory.

  The mgmt message protocol uses the same XDNA command opcodes and response
  semantics as the PCI transport; only the transport differs
  (PCI rings/interrupts versus shared-memory/IPI). The doorbell path carries
  only a 32-bit hardware-context ID to notify firmware to start or continue
  execution for that context. The doorbell interface carries no command payload
  and no endpoint addressing.

properties:
  compatible:
    items:
      - pattern: "^amd,xdna-[0-9a-f]{4}$"
      - const: amd,xdna
    description: |
      The first entry is the specific part, "amd,xdna-<id>", where <id> is the
      16-bit device id in lower-case hex (e.g. amd,xdna-1234).  The second
      entry, "amd,xdna", identifies the common family interface.

  mboxes:
    minItems: 2
    maxItems: 2
    description: |
      Phandle + channel specifier to the ZynqMP IPI mailbox controller.
      Two channels are required:
        - TX channel (index 0) for sending IPI notifications to firmware
        - RX channel (index 1) for receiving IPI notifications from firmware

  mbox-names:
    items:
      - const: tx
      - const: rx

  memory-region:
    minItems: 4
    maxItems: 4
    description: |
      Phandles to reserved-memory regions, matched by name via
      memory-region-names.  Required names are "mgmt", "doorbell", "fw", and
      "aie".  "mgmt"/"doorbell" are predefined-layout transport regions
      accessed only by the host CPU, not allocator pools.  "fw" and "aie" are
      reusable shared-dma-pool regions for buffer storage.  The mgmt and
      doorbell rings share the same "tx"/"rx" mailbox channels for notification
      only.

  memory-region-names:
    minItems: 4
    maxItems: 4
    uniqueItems: true
    description: |
      Names of the memory-region phandles.  Required: "mgmt", "doorbell".
      "fw" and "aie" are also required.  "fw" is firmware-visible and its
      reserved-memory must be placed below 4 GB when firmware reaches only
      32-bit DMA addresses.  "aie" is the device-side AIE/CERT pool and may
      reside above 4 GB if the platform addressing allows it.
    items:
      enum: [mgmt, doorbell, fw, aie]
    allOf:
      - contains:
          const: mgmt
      - contains:
          const: doorbell
      - contains:
          const: fw
      - contains:
          const: aie

required:
  - compatible
  - mboxes
  - mbox-names
  - memory-region
  - memory-region-names

additionalProperties: false

examples:
  - |
    /*
     * Example device tree snippet for ZynqMP / Versal platform.
     *
     * The IPI mailbox controller is the existing xlnx,zynqmp-ipi-mailbox
     * (or xlnx,versal-ipi-mailbox) hardware block. We use bufferless IPI -
     * no "msg" reg-names are provided in the IPI child node.
     */

    / {
        reserved-memory {
            #address-cells = <2>;
            #size-cells = <2>;
            ranges;

            mgmt_shmem: mgmt-shmem@3e000000 {
                reg = <0x0 0x3e000000 0x0 0x100000>;
                no-map;
            };

            doorbell_shmem: doorbell-shmem@3e100000 {
                reg = <0x0 0x3e100000 0x0 0x10000>;
                no-map;
            };

            /* firmware-visible pool, placed < 4 GB for the 32-bit RPU;
             * cacheable, software-coherent.
             * Keep this pool separate from AIE pools. */
            rpu_cma: rpu-cma@70000000 {
                compatible = "shared-dma-pool";
                reg = <0x0 0x70000000 0x0 0x4000000>;
                reusable;
            };

            /* AIE/CERT DMA pool (cacheable, software-coherent, can be > 4 GB) */
            aie_cma: aie-cma@800000000 {
                compatible = "shared-dma-pool";
                reg = <0x8 0x00000000 0x0 0x40000000>;
                reusable;
            };
        };
    };

    /* IPI mailbox controller (already present in platform DTS) */
    ipi_mailbox: mailbox@ff340000 {
        compatible = "xlnx,versal-ipi-mailbox";
        #address-cells = <2>;
        #size-cells = <2>;
        xlnx,ipi-id = <4>;
        ranges;
        interrupts = <0 72 4>;

        ipi_aie: mailbox@ff370000 {
            compatible = "xlnx,versal-ipi-dest-mailbox";
            xlnx,ipi-id = <1>;
            #mbox-cells = <1>;
            /* No reg / reg-names - bufferless IPI */
        };
    };

    /* amdxdna platform (shared-memory + IPI) transport node */
    amdxdna: amdxdna {
        compatible = "amd,xdna-1234", "amd,xdna";
        mboxes = <&ipi_aie 0>, <&ipi_aie 1>;
        mbox-names = "tx", "rx";
        memory-region = <&mgmt_shmem>, <&doorbell_shmem>, <&rpu_cma>, <&aie_cma>;
        memory-region-names = "mgmt", "doorbell", "fw", "aie";
    };
